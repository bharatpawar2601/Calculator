<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcii – Scientific Calculator</title>
    <meta name="description" content="Calcii: a fast calculator with scientific functions, history and keyboard support.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

    <section class="calc" aria-label="Calculator">
        <header class="bar">
            <h1>Calcii</h1>
            <div class="tabs">
                <button class="on" data-a="mode" data-m="basic">Basic</button>
                <button data-a="mode" data-m="sci">Scientific</button>
            </div>
            <button class="icon" id="theme" data-a="theme" aria-label="Switch light or dark theme">◐</button>
        </header>

        <div class="screen">
            <span class="angle" id="angle">DEG</span>
            <div class="expr" id="expr"></div>
            <button class="result" id="result" title="Click to copy">0</button>
        </div>

        <div class="keys sci" id="sci" hidden>
            <button class="fn" data-v="sin(">sin</button>
            <button class="fn" data-v="cos(">cos</button>
            <button class="fn" data-v="tan(">tan</button>
            <button class="fn" data-a="deg" id="degBtn">Deg</button>
            <button class="fn" data-v="log(">log</button>
            <button class="fn" data-v="ln(">ln</button>
            <button class="fn" data-v="√(">√</button>
            <button class="fn" data-v="^">xʸ</button>
            <button class="fn" data-v="π">π</button>
            <button class="fn" data-v="e">e</button>
            <button class="fn" data-v="(">(</button>
            <button class="fn" data-v=")">)</button>
        </div>

        <div class="keys">
            <button class="ac" data-a="clear">AC</button>
            <button data-a="del" aria-label="Delete last">⌫</button>
            <button class="op" data-v="%">%</button>
            <button class="op" data-v="÷">÷</button>

            <button data-v="7">7</button>
            <button data-v="8">8</button>
            <button data-v="9">9</button>
            <button class="op" data-v="×">×</button>

            <button data-v="4">4</button>
            <button data-v="5">5</button>
            <button data-v="6">6</button>
            <button class="op" data-v="−">−</button>

            <button data-v="1">1</button>
            <button data-v="2">2</button>
            <button data-v="3">3</button>
            <button class="op" data-v="+">+</button>

            <button data-v="0">0</button>
            <button data-v=".">.</button>
            <button data-a="ans">Ans</button>
            <button class="eq" data-a="eq">=</button>
        </div>
    </section>

    <aside class="hist" aria-label="History">
        <div class="hist-head">
            <h2>History</h2>
            <button data-a="clearhist">Clear</button>
        </div>
        <ul id="history"></ul>
    </aside>

</main>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
